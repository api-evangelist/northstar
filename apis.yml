name: Northstar
description: 'Northstar is an employer-sponsored financial wellness benefit that helps
  employees understand, manage, and get the most out of their total compensation and
  personal finances. Delivered as a workplace benefit (offered by employers to their
  workforce), Northstar pairs financial guidance with tools for budgeting, saving,
  equity/compensation planning, and overall money management. The company is a fintech
  provider backed by GGV Capital. It was surfaced as a portfolio company and added
  to the API Evangelist network as a stub for enrichment. As of this enrichment pass,
  Northstar publishes a marketing site, blog, and legal pages, but exposes no public
  developer portal, API documentation, OpenAPI specification, SDKs, MCP server, or
  /.well-known discovery surface — its product is consumed as an employee benefit,
  not as a developer API.'
